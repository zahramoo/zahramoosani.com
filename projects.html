<style>
  :root {
    --paper: #FAF9F6;
    --ink: #6F1F37;
    --ink-soft: #8B4D68;
    --line: #D6D5B3;
    --heading: #B71C1C;
    --accent: #C5050C;
    --chip: #F5DBCB;
    --frame: #F5DBCB;
    --detail: #D6D5B3;
    --shadow: 0 24px 80px rgba(31, 27, 27, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top center, rgba(197, 5, 12, 0.08), transparent 28%),
                radial-gradient(circle at bottom left, rgba(31, 27, 27, 0.05), transparent 22%),
                var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    z-index: 0;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: radial-gradient(circle at 18% 22%, rgba(197, 5, 12, 0.08) 0%, transparent 24%),
                      radial-gradient(circle at 84% 78%, rgba(31, 27, 27, 0.05) 0%, transparent 18%);
    opacity: 0.75;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 28px 88px;
    background: transparent;
    border: none;
    border-radius: 28px;
    box-shadow: 0 24px 80px rgba(31, 27, 27, 0.08);
    position: relative;
    z-index: 1;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 40px;
    gap: 16px;
  }

  .name-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    object-fit: cover;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--heading);
  }

  .clocks {
    display: flex;
    gap: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: right;
  }

  .clock-city { color: var(--ink); font-weight: 500; }
  .clock-time { letter-spacing: 0.02em; }
  .clock-zone { font-size: 10px; opacity: 0.7; }

  nav {
    display: flex;
    gap: 18px;
    margin-bottom: 48px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  nav a {
    color: var(--ink-soft);
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 999px;
    transition: color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }

  nav a.current {
    color: var(--ink);
    background: rgba(197, 5, 12, 0.08);
  }

  nav a:hover {
    color: var(--accent);
    transform: translateY(-1px);
  }

  .section-title {
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    color: var(--heading);
    margin: 0 0 14px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
  }

  .page-blurb {
    font-size: 16px;
    line-height: 1.8;
    color: var(--ink-soft);
    max-width: 680px;
    margin: 0 0 34px;
    font-family: 'Work Sans', sans-serif;
  }

  .section-title:not(:first-of-type) {
    margin-top: 64px;
  }

  ul.proj-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  ul.proj-list li {
    font-size: 16px;
    line-height: 1.7;
    background: linear-gradient(180deg, #ffffff, #fbf5f5);
    border: 1px solid rgba(227, 217, 217, 0.95);
    border-radius: 18px;
    padding: 18px 20px;
    box-shadow: 0 18px 34px rgba(31, 27, 27, 0.06);
    opacity: 0;
    transform: translateY(22px);
    transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s ease, box-shadow 0.25s ease;
  }

  ul.proj-list li:hover {
    transform: translateY(-2px);
    box-shadow: 0 24px 42px rgba(31, 27, 27, 0.1);
  }

  ul.proj-list li.visible {
    opacity: 1;
    transform: translateY(0);
  }

  ul.proj-list .entry-name {
    font-weight: 600;
  }

  .entry-name.c-green  { color: #2F6F4E; }
  .entry-name.c-purple { color: #5B4B8A; }
  .entry-name.c-blue   { color: #1D5FAE; }
  .entry-name.c-black  { color: #171717; }
  .entry-name.c-orange { color: #C1650C; }
  .entry-name.c-pink   { color: #D6336C; }
  .entry-name.c-teal   { color: #1F6F78; }
  .entry-name.c-gold   { color: #B07D00; }

  footer {
    margin-top: 56px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }

  @media (max-width: 480px) {
    header { flex-direction: column; }
    .clocks { text-align: left; }
  }
</style>
</head>

      el.appendChild(li);
    });
  }

  renderList(current, 'currentList');
  renderList(previous, 'previousList');

  // ----- fade-in reveal as each bubble scrolls into view -----
  const allItems = document.querySelectorAll('.proj-list li');
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 90);
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });

  allItems.forEach(li => revealObserver.observe(li));

</script>

</body>
</html>
